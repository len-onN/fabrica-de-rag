services:
  postgres:
    ports:
      - "${RAG_POSTGRES_PORT:-5433}:5432"

  qdrant:
    ports:
      - "${RAG_QDRANT_HTTP_PORT:-6333}:6333"
      - "${RAG_QDRANT_GRPC_PORT:-6334}:6334"

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      QDRANT_HOST: qdrant
    depends_on:
      - postgres
      - qdrant
    networks:
      - ragcreator
