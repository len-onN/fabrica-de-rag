name: ${RAG_COMPOSE_PROJECT:-ragcreator-e2e}

services:
  postgres:
    restart: "no"
    environment:
      POSTGRES_DB: ${RAG_E2E_POSTGRES_DB:-ragcreator_e2e}
      POSTGRES_USER: ${RAG_E2E_POSTGRES_USER:-ragcreator_e2e}
      POSTGRES_PASSWORD: ${RAG_E2E_POSTGRES_PASSWORD:-ragcreator_e2e_password}
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data

  qdrant:
    restart: "no"
    volumes:
      - qdrant_e2e_data:/qdrant/storage

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.e2e
    restart: "no"
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      QDRANT_HOST: qdrant
      DB_USER: ragcreator_e2e
      DB_PASSWORD: ragcreator_e2e_password
    depends_on:
      - postgres
      - qdrant
    networks:
      - ragcreator

  worker:
    build:
      context: ../../apps/worker
      dockerfile: Dockerfile
    restart: "no"
    environment:
      QDRANT_HOST: qdrant
    depends_on:
      - qdrant

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile.e2e
    restart: "no"
    ports:
      - "4200:4200"
    depends_on:
      - api

volumes:
  postgres_e2e_data:
  qdrant_e2e_data:
